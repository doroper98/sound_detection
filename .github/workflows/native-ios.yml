name: Native iOS
on:
  pull_request:
    paths:
      - 'native/ios/**'
      - '.github/workflows/native-ios.yml'
  push:
    branches: [main]
    paths:
      - 'native/ios/**'
      - '.github/workflows/native-ios.yml'
  workflow_dispatch:
    inputs:
      researchOnly:
        description: 'Validate recording/replay without building an IPA'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify native iPhone prototype
        env:
          RESEARCH_ONLY: ${{ inputs.researchOnly }}
        run: bash native/ios/scripts/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ios-evidence
          path: native/ios/DerivedData/evidence/
          retention-days: 14
