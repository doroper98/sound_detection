name: Native iOS
on:
  pull_request:
    paths:
      - 'native/ios/**'
      - '.github/workflows/native-ios.yml'
  push:
    branches: [main]
    paths:
      - 'native/ios/**'
      - '.github/workflows/native-ios.yml'
  workflow_dispatch:
    inputs:
      researchOnly:
        description: 'Validate recording/replay without building an IPA'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows-replay:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.2.3-release
          swift-build: 6.2.3-RELEASE
      - name: Verify portable Windows replay on synthetic data
        shell: pwsh
        run: ./native/ios/scripts/verify-research-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foa-replay-windows
          path: native/ios/DerivedData/windows/
          retention-days: 14
  native:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify native iPhone prototype
        env:
          RESEARCH_ONLY: ${{ inputs.researchOnly }}
        run: bash native/ios/scripts/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ios-evidence
          path: native/ios/DerivedData/evidence/
          retention-days: 14
